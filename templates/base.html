<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WildGuard Detection{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body class="wildguard-theme {% if request.endpoint == 'farmer_dashboard' %}farmer-page{% endif %}">
  <nav class="topbar">
    <a href="{{ url_for('index') }}" class="brand-mark">
      <span class="brand-mark-icon">WG</span>
      <span>WildGuard</span>
    </a>

    <div class="topbar-links">
      <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Detection</a>
      <a href="{{ url_for('farmer_login') }}" class="nav-link {% if request.endpoint == 'farmer_login' %}active{% endif %}">Farmer Login</a>
      {% if session.get('farmer_logged_in') %}
      <a href="{{ url_for('farmer_dashboard') }}" class="nav-link {% if request.endpoint == 'farmer_dashboard' %}active{% endif %}">Farmer Dashboard</a>
      {% endif %}
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-container"></div>

  <footer class="footer">
    <p>Wild animal intrusion detection for local farm monitoring.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
